<title>（株）アニマ社員経費</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f8fc;
    --navy-900: #1c3a5c;
    --navy-800: #2f7ab5;
    --navy-700: #4a92cc;
    --accent: #2f9e6f;
    --accent-soft: #e6f6ee;
    --card: #ffffff;
    --border: #e2eaf2;
    --ink: #26313d;
    --ink-soft: #72808f;
    --danger: #c0483c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 16px 48px; }

  .header-band {
    background: linear-gradient(160deg, #ffffff, #eaf3fb);
    border: 1px solid var(--border);
    margin: 0 -16px 24px;
    padding: 26px 16px 22px;
    border-radius: 0 0 20px 20px;
    border-top: none;
    box-shadow: 0 2px 10px rgba(47,122,181,0.08);
  }
  .chip {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--navy-800);
    background: var(--accent-soft);
    padding: 4px 11px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .header-band h1 {
    font-size: 21px;
    font-weight: 800;
    color: var(--navy-900);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .header-band .subtitle { margin: 0; font-size: 13px; color: var(--ink-soft); }

  h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy-900);
    margin: 0 0 14px;
    padding-left: 11px;
    border-left: 3px solid var(--accent);
  }

  .entry-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px 20px;
    box-shadow: 0 2px 10px rgba(19,37,61,0.06);
    margin-bottom: 26px;
  }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select {
    width: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .field select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .add-category-btn {
    margin-top: 7px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;

      return fallback;

  function compressImage(file) {
    const TARGET_BYTES = 900000; // aim well under the 5MB per-key storage limit
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const widths = [1000, 800, 600, 450];
          const qualities = [0.7, 0.55, 0.4, 0.3];
          let result = null;
          for (const w of widths) {
            const scale = Math.min(1, w / img.width);
            const cw = Math.round(img.width * scale);
            const ch = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            for (const q of qualities) {
              const dataUrl = canvas.toDataURL('image/jpeg', q);
              const approxBytes = dataUrl.length * 0.75;
              if (approxBytes <= TARGET_BYTES) {
                result = dataUrl;
                break;
              }
              result = dataUrl; // keep smallest attempt so far as fallback
            }
            if (result && result.length * 0.75 <= TARGET_BYTES) break;
          }
          if (!result) {
            reject(new Error('圧縮に失敗しました'));
            return;
          }
          resolve(result);
        };
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
      reader.readAsDataURL(file);
    });
  }

  async function runReceiptOCR(photoDataUrl) {
    if (!SHEET_WEBHOOK_URL || !photoDataUrl || ocrInProgress) return;
    const requestSequence = ++ocrRequestSequence;
    clearError();
    ocrInProgress = true;
    ocrReady = false;
    const submitBtn = form.querySelector('.submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'レシート読取中…';
    if (ocrStatusEl) ocrStatusEl.textContent = 'レシートから日付・内容・税率・金額を読み取っています…';
    showToast('レシートを解析しています…');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);
    try {
      // Content-Type ヘッダーを明示しないことで、ブラウザごとのCORS/URL解釈差を避けます。
      // Apps Script 側では e.postData.contents から同じJSONを受け取れます。
      // Apps Script のPOST応答は外部サイト(GitHub Pages)から読むと
      // Google側のリダイレクト/CORSで失敗することがあるため、
      // POSTは no-cors で送信し、結果はGETでポーリングして受け取ります。
      const requestId = 'ocr_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);

      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'ocr_async',
          requestId,
          photoData: photoDataUrl
        })
      });

      let result = null;
      let notFoundCount = 0;
      const pollStarted = Date.now();
      while ((Date.now() - pollStarted) < 30000) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        const pollUrl = SHEET_WEBHOOK_URL + '?ocrResult=' + encodeURIComponent(requestId) + '&_ts=' + Date.now();
        const pollRes = await fetch(pollUrl, { method: 'GET', cache: 'no-store', credentials: 'omit', signal: controller.signal });
        if (pollRes.status === 404) {
          notFoundCount += 1;
          if (notFoundCount >= 2) {
            throw new Error('OCR_ENDPOINT_404');
          }
          continue;
        }
        if (!pollRes.ok) continue;
        const pollText = await pollRes.text();
        let pollJson;
        try { pollJson = JSON.parse(pollText); } catch (_) { continue; }
        if (pollJson && pollJson.status === 'pending') continue;
        if (pollJson && pollJson.status === 'done') { result = pollJson.result || {}; break; }
        if (pollJson && pollJson.status === 'error') {
          throw new Error(pollJson.error || 'OCRサーバーでエラーが発生しました');
        }
      }
      if (!result) throw new Error('OCR結果の受信が30秒以内に完了しませんでした');
      // A late response for an older photo must never overwrite the current form.
      if (requestSequence !== ocrRequestSequence || photoDataUrl !== pendingPhoto) return;
      if (result.error) {
        showError('読み取り失敗：' + String(result.error).slice(0, 200));
        return;
      }
      let filledAny = false;
      const storeName = result.storeName ? String(result.storeName).trim() : '';
      let description = '';
      if (result.description) description = String(result.description).trim();
      else if (result.content) description = String(result.content).trim();
      else if (result.memo) description = String(result.memo).trim();
      else if (Array.isArray(result.items)) description = result.items.map(x => typeof x === 'string' ? x : (x && (x.name || x.item || x.description)) || '').filter(Boolean).slice(0, 8).join('、');
      lastOcrStoreName = [storeName, description].filter(Boolean).join(' / ');
      if (lastOcrStoreName) {
        storeNameInput.value = lastOcrStoreName;
        filledAny = true;
      }
      if (result.amount != null && !isNaN(Number(result.amount))) {
        amountInput.value = formatMoneyValue(Math.round(Number(result.amount)));
        filledAny = true;
      }
      if (result.date && /^\d{4}-\d{2}-\d{2}$/.test(result.date)) {
        expenseDateInput.value = result.date;
        filledAny = true;
      }
      const tax8 = Number(result.tax8) || 0;
      const tax10 = Number(result.tax10) || 0;
      lastOcrTax8 = tax8;
      lastOcrTax10 = tax10;
      tax8AmountInput.value = tax8 > 0 ? formatMoneyValue(Math.round(tax8)) : '';
      tax10AmountInput.value = tax10 > 0 ? formatMoneyValue(Math.round(tax10)) : '';
      if (tax8 > 0 && tax10 > 0) taxRateInput.value = 'mixed';
      else if (tax8 > 0) taxRateInput.value = '8';
      else if (tax10 > 0) taxRateInput.value = '10';
      if (!memo1Input.value.trim()) {
        if (description) { memo1Input.value = description; filledAny = true; }
        else if (storeName) { memo1Input.value = storeName; filledAny = true; }
      }
      const essentialOk = !!expenseDateInput.value && !!amountInput.value && !!storeNameInput.value.trim();
      ocrReady = essentialOk;
      if (ocrStatusEl) ocrStatusEl.textContent = essentialOk
        ? '✅ 自動読取完了。内容を確認し、間違いがある場合だけ修正してください。'
        : '⚠️ 一部を読み取れませんでした。撮り直すか、読み取れなかった欄だけ修正してください。';
      showToast(filledAny ? 'レシート内容を自動入力しました' : '自動読み取りできる内容がありませんでした');
    } catch (e) {
      const rawMessage = String(e && e.message ? e.message : e);
      const endpointMissing = rawMessage === 'OCR_ENDPOINT_404' || /HTTP 404/.test(rawMessage);
      const msg = endpointMissing
        ? 'OCR接続先が見つかりません（404）。Apps Scriptを新バージョンで再デプロイしてください。'
        : (e && e.name === 'AbortError'
          ? '通信が30秒以内に完了しませんでした。電波状況を確認して再度お試しください。'
          : rawMessage.slice(0, 220));
      ocrReady = false;
      if (ocrStatusEl) ocrStatusEl.textContent = '❌ 自動読取に失敗しました。写真を撮り直すか「もう一度読み取る」を押してください。';
      showError('レシートの自動読取に失敗しました。まず再読取をお試しください。\n詳細：' + msg);
    } finally {
      clearTimeout(timeoutId);
      ocrInProgress = false;
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = false;
      submitBtn.textContent = '下書き登録する';
    }
  }

  function parseMoneyValue(value) {
    const normalized = String(value || '').replace(/[０-９]/g, (digit) =>

    const digits = normalized.replace(/[^0-9]/g, '');
    return digits ? Number(digits) : 0;
  }

  function formatYen(n) {

  function formatDate(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
  }
  function formatAccountingMonth(value) {
    const text = String(value || '').trim();
    if (!text) return '';
    const ja = text.match(/^(\d{4})年\s*(\d{1,2})月$/);
    if (ja) return ja[1] + '年' + Number(ja[2]) + '月';
    const ym = text.match(/^(\d{4})[-\/]\s*(\d{1,2})$/);
    if (ym) return ym[1] + '年' + Number(ym[2]) + '月';
    const d = new Date(text);
    if (isNaN(d.getTime())) return text;
    const parts = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric'
    }).formatToParts(d);
    const year = parts.find((part) => part.type === 'year');
    const month = parts.find((part) => part.type === 'month');
    return year && month ? year.value + '年' + Number(month.value) + '月' : text;
  }

  async function submitExpense(entry) {

    const ok = await showConfirm('この内容で経理担当へ申請しますか？\n申請すると経理担当へメールが届きます。', '申請する');

    const requestId = 'submit_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    try {
      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'expense_submit',
          requestId,
          id: entry.id,

        })

        await new Promise((resolve) => setTimeout(resolve, 1000));
        const url = SHEET_WEBHOOK_URL + '?submitResult=' + encodeURIComponent(requestId) + '&_ts=' + Date.now();
        const response = await fetch(url, { cache: 'no-store', credentials: 'omit' });
        if (!response.ok) continue;
        const json = await response.json();
        if (json.status === 'pending') continue;
        outcome = json;
        break;
      }
      if (!outcome) throw new Error('申請結果を確認できませんでした');
      if (outcome.status !== 'done') throw new Error(outcome.error || '申請できませんでした');

      [entries, allExpenses].forEach((list) => {
        const found = list.find((item) => item.id === entry.id);
        if (found) found.status = '申請済';
      });
      saveJSON('expense-entries', entries);
      detailModal.hidden = true;
      showToast('経理担当へ申請しました');
      await fetchSharedDirectories();
    } catch (error) {
      showError('申請できませんでした：' + String(error.message || error));
    } finally {
      detailSubmitExpenseBtn.disabled = false;
      detailSubmitExpenseBtn.textContent = '申請する';
    }
  }

  async function cancelExpense(entry) {
    if (!entry || !entry.id) {
      showError('この申請は取消機能追加前のため、画面から取り消せません。');
      return;
    }
    const ok = await showConfirm('この申請を取り消しますか？\nスプレッドシートの行も削除され、管理者へ取消通知が送られます。', '申請を取り消す');
    if (!ok) return;

    detailCancelExpenseBtn.disabled = true;
    detailCancelExpenseBtn.textContent = '取消処理中…';
    const requestId = 'cancel_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    try {
      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'expense_cancel',
          requestId,
          id: entry.id,
          employeeNo: currentEmployeeNo,
          sourceUrl: location.href
        })
      });

      let outcome = null;
      const started = Date.now();
      while (Date.now() - started < 20000) {
        await new Promise((resolve) => setTimeout(resolve, 1000));
        const url = SHEET_WEBHOOK_URL + '?cancelResult=' + encodeURIComponent(requestId) + '&_ts=' + Date.now();
        const response = await fetch(url, { cache: 'no-store', credentials: 'omit' });
        if (!response.ok) continue;
        const json = await response.json();
        if (json.status === 'pending') continue;
        outcome = json;
        break;
      }
      if (!outcome) throw new Error('取消結果を確認できませんでした');
      if (outcome.status !== 'done') throw new Error(outcome.error || '取消できませんでした');

      entries = entries.filter((item) => item.id !== entry.id);
      allExpenses = allExpenses.filter((item) => item.id !== entry.id);
      saveJSON('expense-entries', entries);
      detailModal.hidden = true;
      showToast('申請を取り消しました');
      loadEntries();
    } catch (error) {
      showError('申請を取り消せませんでした：' + String(error.message || error));
    } finally {
      detailCancelExpenseBtn.disabled = false;
      detailCancelExpenseBtn.textContent = '申請を取り消す';
    }
  }

  function isAdmin(no) {
    return ADMIN_EMPLOYEE_NOS.includes(no);
  }

  function entryKey(entry) {
    return (entry.timestamp || '') + '|' + (entry.employeeNo || '') + '|' + (entry.amount || '');
  }

  function getHiddenKeys() {
    if (!currentEmployeeNo) return [];
    return loadJSON('expense-hidden-' + currentEmployeeNo, []);
  }

  function hideEntryForSelf(entry) {
    if (!currentEmployeeNo) return;
    const key = entryKey(entry);
    const hidden = getHiddenKeys();
    if (!hidden.includes(key)) {
      hidden.push(key);
      saveJSON('expense-hidden-' + currentEmployeeNo, hidden);
    }
  }

  function monthLabel(entry) {
    const src = entry.expenseDate || entry.timestamp;
    if (!src) return 'その他';
    const d = new Date(src);
    if (isNaN(d.getTime())) return 'その他';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  }

  function loadEntries() {
    const usingServerData = allExpenses.length > 0;
    const source = usingServerData ? allExpenses : entries;
    const admin = isAdmin(currentEmployeeNo);
    let visibleEntries = admin
      ? source
      : source.filter((e) => e.employeeNo === currentEmployeeNo);
    const hidden = getHiddenKeys();
    if (hidden.length) {
      visibleEntries = visibleEntries.filter((e) => {
        // Only ever hide entries belonging to the logged-in person themselves
        if (e.employeeNo !== currentEmployeeNo) return true;
        return !hidden.includes(entryKey(e));
      });
    }
    const viewLabel = document.getElementById('history-view-label');
    if (viewLabel) {
      viewLabel.textContent = admin ? '管理者ビュー：全員の申請' : '自分の申請履歴';
    }
    renderEntries(visibleEntries, !usingServerData);
  }

  function renderEntries(entries, allowFullDelete) {
    if (!entries.length) {
      entriesList.innerHTML = '<div class="empty-state">まだ申請がありません。上のフォームから最初の経費を登録してください。</div>';
      return;
    }
    entriesList.innerHTML = '';
    const sorted = entries.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    const groups = [];
    const groupIndex = {};
    sorted.forEach((entry) => {
      const label = monthLabel(entry);
      if (!(label in groupIndex)) {
        groupIndex[label] = groups.length;
        groups.push({ label, items: [] });
      }
      groups[groupIndex[label]].items.push(entry);
    });

    groups.forEach((group) => {
      const heading = document.createElement('p');
      heading.style.cssText = 'font-weight:700; font-size:13px; color:var(--navy-800); margin:14px 0 8px;';
      heading.textContent = group.label;
      entriesList.appendChild(heading);

      group.items.forEach((entry) => {
        const row = document.createElement('div');
        row.className = 'ledger-row';
        row.style.marginBottom = '10px';
        row.style.cursor = 'pointer';
        row.setAttribute('role', 'button');
        row.setAttribute('tabindex', '0');
        row.setAttribute('aria-label', '申請内容を表示');
        row.addEventListener('click', () => showEntryDetail(entry));
        row.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            showEntryDetail(entry);
          }
        });

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const img = document.createElement('img');
        const isLocalPhoto = !!entry.photoData;
        if (isLocalPhoto) {
          img.src = entry.photoData;
        } else if (entry.photoUrl) {
          img.src = entry.photoUrl;
        }
        thumb.appendChild(img);
        thumb.addEventListener('click', (event) => {
          event.stopPropagation();
          if (isLocalPhoto) {
            lightboxImg.src = entry.photoData;
            lightbox.hidden = false;
          } else if (entry.photoUrl) {
            window.open(entry.photoUrl, '_blank');
          }
        });

        const meta = document.createElement('div');
        meta.className = 'meta';
        const empLabel = '社員番号 ' + escapeHtml(entry.employeeNo) + (entry.employeeName ? '（' + escapeHtml(entry.employeeName) + '）' : '');
        const siteLine = entry.siteName
          ? ('現場 ' + escapeHtml(entry.siteName))
          : '';
        const subLine = entry.memo
          ? (empLabel + (siteLine ? ' ・ ' + siteLine : '') + ' ・ ' + escapeHtml(entry.memo))
          : (empLabel + (siteLine ? ' ・ ' + siteLine : '') + ' ・ ' + (entry.expenseDate || formatDate(entry.timestamp)));
        const tax8Val = Number(entry.tax8) || 0;
        const tax10Val = Number(entry.tax10) || 0;
        const taxParts = [];
        if (tax8Val > 0) taxParts.push('8%対象:' + formatYen(tax8Val));
        if (tax10Val > 0) taxParts.push('10%対象:' + formatYen(tax10Val));
        const taxLine = taxParts.length ? '<p class="sub">' + taxParts.join(' ・ ') + '</p>' : '';
        const statusLine = '<p class="sub">状態：' + escapeHtml(entry.status || '下書き') + '</p>';
        meta.innerHTML =
          '<p class="category">' + escapeHtml(entry.category) + (entry.paymentMethod ? ' ・ ' + escapeHtml(entry.paymentMethod) : '') + '</p>' +
          '<p class="sub">' + subLine + '</p>' + statusLine + taxLine;

        const amountCol = document.createElement('div');
        amountCol.className = 'amount-col';
        const amountEl = document.createElement('div');
        amountEl.className = 'amount';
        amountEl.textContent = formatYen(entry.amount);
        amountCol.appendChild(amountEl);

        const isOwnEntry = entry.employeeNo === currentEmployeeNo;
        if (allowFullDelete && entry.id) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '削除';
          delBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            deleteEntry(entry.id);
          });
          amountCol.appendChild(delBtn);
        } else if (isOwnEntry) {
          const hideBtn = document.createElement('button');
          hideBtn.className = 'del-btn';
          hideBtn.textContent = '履歴から削除';
          hideBtn.addEventListener('click', async (event) => {
            event.stopPropagation();
            const ok = await showConfirm('この申請を自分の履歴から削除しますか？\n（スプレッドシート上の記録は残ります。他の人の画面には影響しません。）', '履歴から削除');
            if (!ok) return;
            hideEntryForSelf(entry);
            showToast('履歴から削除しました');
            loadEntries();
          });
          amountCol.appendChild(hideBtn);
        }

        row.appendChild(thumb);
        row.appendChild(meta);
        row.appendChild(amountCol);
        entriesList.appendChild(row);
      });
    });
  }

  function postToSheet(payload) {
    if (!SHEET_WEBHOOK_URL) return;
    try {
      fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(() => { /* network error; local copy is unaffected */ });
    } catch (e) { /* ignore */ }
  }

  function sendToSheet(entry) {
    postToSheet({
      type: 'expense_draft',
      employeeNo: entry.employeeNo,
      employeeName: entry.employeeName || '',
      expenseDate: entry.expenseDate || '',
      siteName: entry.siteName || '',
      paymentMethod: entry.paymentMethod || '',
      category: entry.category,
      memo: entry.memo || '',
      memo1: entry.memo1 || '',
      memo2: entry.memo2 || '',
      memo3: entry.memo3 || '',
      amount: entry.amount,
      tax8: entry.tax8 || 0,
      tax10: entry.tax10 || 0,
      photoData: entry.photoData || '',
      id: entry.id,
      timestamp: entry.timestamp,
      accountingMonth: currentClosingInfo ? currentClosingInfo.accountingMonth : '',
      notifyAdmin: false,
      sourceUrl: location.href
    });
  }

  async function fetchSharedDirectories() {
    if (!SHEET_WEBHOOK_URL) return false;
    try {
      const dirUrl = SHEET_WEBHOOK_URL + (SHEET_WEBHOOK_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      const res = await fetch(dirUrl, { method: 'GET', cache: 'no-store', credentials: 'omit' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.employees && typeof data.employees === 'object') {
        employeeDirectory = data.employees;
        saveJSON('expense-employee-directory', employeeDirectory);
      }
      if (Array.isArray(data.sites)) {
        siteNames = data.sites;
        saveJSON('expense-site-names', siteNames);
      }
      if (Array.isArray(data.expenses)) {
        allExpenses = data.expenses;
      }
      if (data.closingInfo && typeof data.closingInfo === 'object') {
        currentClosingInfo = data.closingInfo;
        const closingEl = document.getElementById('closing-info');
        if (closingEl) {
          closingEl.hidden = false;
          closingEl.innerHTML =
            '<strong>今月の経費締め日：' + escapeHtml(data.closingInfo.closingDate || '－') + '</strong><br>' +
            '<span class="employee-hint">本日の申請は ' + escapeHtml(formatAccountingMonth(data.closingInfo.accountingMonth) || '－') + ' 計上です。締め日後は翌月分になります。</span>';
        }
      }
      renderDirectory();
      renderSiteOptions();
      if (currentEmployeeNo && employeeDirectory[currentEmployeeNo]) {
        applyLogin(currentEmployeeNo);
      }
      loadEntries();
      return true;
    } catch (e) {
      return false;
    }
  }

  document.getElementById('refresh-directories-btn').addEventListener('click', async () => {
    showToast('更新しています…');
    const ok = await fetchSharedDirectories();
    showToast(ok ? '最新の情報に更新しました' : '更新に失敗しました（オフラインの可能性があります）');
  });

  function csvField(value) {
    const str = String(value == null ? '' : value);
    if (/[",\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  async function exportCSV() {
    const source = allExpenses.length ? allExpenses : entries;
    const exportEntries = isAdmin(currentEmployeeNo)
      ? source
      : source.filter((e) => e.employeeNo === currentEmployeeNo);
    if (!exportEntries.length) {
      showToast('申請履歴がありません');
      return;
    }
    const headers = ['申請日時', '社員番号', '氏名', '利用日', '現場名', '支払方法', '項目', '摘要①', '摘要②', '摘要③', '金額', '8%対象', '10%対象'];
    const rows = exportEntries.map((e) => [
      e.timestamp ? new Date(e.timestamp).toLocaleString('ja-JP') : '',
      e.employeeNo || '',
      e.employeeName || '',
      e.expenseDate || '',
      e.siteName || '',
      e.paymentMethod || '',
      e.category || '',
      e.memo1 != null ? e.memo1 : (e.memo || ''),
      e.memo2 || '',
      e.memo3 || '',
      e.amount != null ? e.amount : '',
      e.tax8 || '',
      e.tax10 || ''
    ]);
    const csvLines = [headers, ...rows].map((row) => row.map(csvField).join(','));
    const csvContent = '\uFEFF' + csvLines.join('\r\n');
    const fileName = '経費一覧_' + new Date().toISOString().slice(0, 10) + '.csv';
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

    try {
      const file = new File([blob], fileName, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  document.getElementById('export-csv-btn').addEventListener('click', exportCSV);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function deleteEntry(id) {
    const ok = await showConfirm('この申請を削除しますか？');
    if (!ok) return;
    entries = entries.filter((x) => x.id !== id);
    saveJSON('expense-entries', entries);
    showToast('削除しました');
    loadEntries();
  }

  lightbox.addEventListener('click', () => { lightbox.hidden = true; });
  detailCloseBtn.addEventListener('click', () => { detailModal.hidden = true; });
  detailPrintSheetBtn.addEventListener('click', () => printReceiptMountSheet(detailEntry));
  detailSubmitExpenseBtn.addEventListener('click', () => submitExpense(detailEntry));
  detailCancelExpenseBtn.addEventListener('click', () => cancelExpense(detailEntry));
  detailModal.addEventListener('click', (event) => {
    if (event.target === detailModal) detailModal.hidden = true;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const employeeNo = employeeNoInput.value.trim();
    const expenseDate = expenseDateInput.value;
    const paymentMethod = paymentMethodInput.value;
    const siteName = siteNameInput.value.trim();
    const memo1 = memo1Input.value.trim();
    const memo2 = memo2Input.value.trim();
    const memo3 = memo3Input.value.trim();
    const memo = [memo1, memo2, memo3].filter(Boolean).join(' / ');
    const amount = parseMoneyValue(amountInput.value);
    const category = storeNameInput.value.trim() || lastOcrStoreName || '経費';
    lastOcrStoreName = storeNameInput.value.trim();
    lastOcrTax8 = parseMoneyValue(tax8AmountInput.value);
    lastOcrTax10 = parseMoneyValue(tax10AmountInput.value);

    if (!employeeNo || !expenseDate || !paymentMethod || !amount) {
      showError('社員番号・利用日・支払方法・金額を入力してください。');
      return;
    }
    if (!pendingPhoto) {
      showError('領収書の写真を選択してください。');
      return;
    }

    const submitBtn = form.querySelector('.submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = '登録中…';

    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const entry = {
      id,
      employeeNo,
      employeeName: employeeName(employeeNo),
      expenseDate,
      paymentMethod,
      siteName,
      category,
      memo,
      memo1,
      memo2,
      memo3,
      amount,
      tax8: lastOcrTax8 || 0,
      tax10: lastOcrTax10 || 0,
      photoData: pendingPhoto,
      timestamp: new Date().toISOString(),
      status: '下書き',
      accountingMonth: currentClosingInfo ? currentClosingInfo.accountingMonth : ''
    };

    try {
      entries.unshift(entry);
      saveJSON('expense-entries', entries);
      sendToSheet(entry);
      form.reset();
      lastOcrStoreName = '';
      lastOcrTax8 = 0;
      lastOcrTax10 = 0;
      storeNameInput.value = '';
      taxRateInput.value = '';
      tax8AmountInput.value = '';
      tax10AmountInput.value = '';
      ocrReview.hidden = true;
      pendingPhoto = null;
      receiptPreview.classList.remove('has-image');
      receiptPreview.textContent = 'タップして撮影・選択';
      showToast('下書きを登録しました。履歴から内容を確認して申請してください。');
      loadEntries();
      setTimeout(() => { fetchSharedDirectories(); }, 2500);
    } catch (err) {
      showError('保存に失敗しました。もう一度お試しください。（' + (err && err.message ? err.message : '不明なエラー') + '）');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '下書き登録する';
    }
  });

  async function init() {
    const storageStatusEl = document.getElementById('storage-status');
    if (storageStatusEl) {
      storageStatusEl.textContent = STORAGE_AVAILABLE
        ? 'この端末には申請履歴が保存されます。'
        : '※この環境では保存機能が使えないため、閉じると履歴は消えます。';
    }
    if (expenseDateInput) {
      expenseDateInput.value = new Date().toISOString().slice(0, 10);
    }

    renderSiteOptions();
    renderDirectory();

    // ログイン判定より先に、スプレッドシートの最新社員一覧を取得する。
    // 初回アクセスやファイル更新直後でも、携帯下4桁ログインが失敗しにくくなる。
    await fetchSharedDirectories();

    if (currentEmployeeNo && employeeDirectory[currentEmployeeNo]) {
      applyLogin(currentEmployeeNo);
    } else {
      showLoginOverlay();
    }
    loadEntries();
  }

  init();
})();
</script>
</body>
