<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会社用アプリ・接続確認</title><style>body{font:18px/1.7 sans-serif;max-width:40em;margin:40px auto;padding:16px}button{font:inherit;padding:12px 24px}pre{white-space:pre-wrap}</style><h1>会社用アプリ・接続確認</h1><p>申請データを変更せず、通信だけを確認します。</p><button id="check">接続を確認する</button><pre id="result" role="status"></pre><script>
const COMPANY_API_URL = "https://script.google.com/macros/s/AKfycbwL_19ZAF9qMp-_8TqOQbHGP2SPSN6RdPuzJbIoeYeDXONgBqhzF0GUoOvRnV-hloAl0A/exec";
async function call(name,args,ms=45000) {
  if (!['loginExpense','expenseRpc','health'].includes(name)) throw new Error('許可されていない操作です');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    // A simple POST avoids an OPTIONS preflight. Credentials/tokens never go in URLs.
    // Do not retry writes automatically: existing draftStatus verifies lost responses.
    const response = await fetch(COMPANY_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({protocol:'anima-company-web-v1',method:name,args}),
      credentials: 'omit', redirect: 'follow', referrerPolicy: 'no-referrer',
      signal: controller.signal
    });
    if (!response.ok) throw new Error('会社の保存先との通信に失敗しました。時間をおいて、もう一度お試しください。');
    let body;
    try { body = JSON.parse(await response.text()); }
    catch (_) { throw new Error('会社側の通信設定を確認できません。管理者に連絡してください。'); }
    if (!body || typeof body.ok !== 'boolean') throw new Error('会社側の応答形式を確認できません。');
    if (!body.ok) throw new Error(body.error || '処理に失敗しました');
    return body.result;
  } catch (error) {
    if (error && error.name === 'AbortError') throw new Error('通信の応答を確認できませんでした。時間をおいて、もう一度お試しください。');
    if (error instanceof TypeError) throw new Error('会社の保存先に接続できません。通信環境または会社側の更新を確認してください。');
    throw error;
  } finally { clearTimeout(timer); }
}

document.getElementById('check').onclick=async()=>{const b=document.getElementById('check'),r=document.getElementById('result');b.disabled=true;r.textContent='確認中…';try{const v=await call('health',[],20000);r.textContent='接続できました：'+v.version;}catch(e){r.textContent=e.message;}finally{b.disabled=false;}};
</script></html>
